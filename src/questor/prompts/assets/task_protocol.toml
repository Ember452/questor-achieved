description = "task 工具的描述与协议（M4 orchestration；模型据计划建/推进任务）"
body = """Create or advance a board task.

- Creating a task requires a plan to already be on record; otherwise the call is refused with
  `need_plan_first` — propose a plan first.
- Starting execution requires the user's go-ahead; otherwise the call is refused with
  `need_execution_authorization`.
- After a plan is finalized, use `sync` with its `plan_id` to derive one subtask per step;
  steps already synced are never re-derived. Unfinalized plans are refused.
- Use `depends_on` to declare ordering; do not create cycles.
- When a running task is done, call `report` with `task_id` and a `checks` list. Each check is
  `{claimed, tool_use_id}`: `claimed` is the verification you assert (e.g. "pytest passed") and
  `tool_use_id` must be the id of the tool call that actually produced that result. The system
  compares each claim against the recorded output — a claim with no matching record is
  `unverified` and regresses the task. Never claim a check you did not run.
- Report the outcome of a task honestly: a command that timed out or a check you did not run is
  not a completed task."""
