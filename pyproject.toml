[project]
name = "questor"
# 版本唯一来源是仓库根的 VERSION 文件（CalVer YYYY.M.D，structure §10）；
# 静态 version 会与它形成两套真相，护栏测试 tests/unit/test_version.py 会咬
dynamic = ["version"]
description = "Auditable AI agent workstation: steer running work, review real diffs, verify claimed results."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Solis" }]
keywords = [
  "ai-coding-agent",
  "agent-workstation",
  "human-in-the-loop",
  "audit",
  "diff-review",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
    "pydantic>=2.0",
    "pywin32>=306 ; sys_platform == 'win32'",
    # M3b-3 引入（ADR-0022）：serve 层 WS 传输与本地 http 宿主；uvicorn 只做本地 ASGI
    # 服务器，M8 自托管部署若要 gunicorn/hypercorn 另开 ADR。不引 FastAPI/aiohttp。
    # [standard] 带 websockets：uvicorn 本体不含 WS 协议栈，裸装会让 /ws 握手 404
    #（Starlette TestClient 进程内模拟 WS，故集成测试测不出——真起服务才暴露）。
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

# 入口已打开：M2.3 的 cli 模块落地后，`questor` / `qst` 两个名字指向同一个 main。
[project.scripts]
questor = "questor.cli:main"
qst = "questor.cli:main"

# M2.3 的 providers 传输层选型（只引 httpx、不引厂商 SDK）见 ADR-0016。

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.6",
  "pyright>=1.1.350",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
  "import-linter>=2.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# 构建时从 VERSION 文件提取版本；pattern 显式声明，避免依赖 hatchling 对
# 裸文本文件的默认猜测（那是隐式行为，坏了不好查）
[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>\d+\.\d+\.\d+)'

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/questor"]

# Lower bound enforcement: the local interpreter is 3.13 (see .python-version),
# but the published floor is 3.12 so the reference projects' dependency wheels
# stay reachable. These two settings are what make that promise true.
# tests/test_project_metadata.py fails if any of the three drifts apart.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "." 让 `import evals...` 在非安装态下可解析（evals 是非生产包）
pythonpath = ["src", "."]

# 依赖方向的声明式契约（structure §5 预案：随 M2 首批真实模块引入）。AST 矩阵
# （tests/architecture/test_dependency_matrix.py）查"顶层包 import 了谁"，本节查环与
# 同层绕行，两层各查各的。0 违规起步，不设 baseline。契约随模块物化逐步扩展：
# 新顶层包必须先在 structure §5 与 overview §6 登记，再进这里的分层（import-linter
# 要求契约中的模块已存在，故分层契约只列已物化模块，与提交节奏同步生长）。
[tool.importlinter]
root_packages = ["questor"]

[[tool.importlinter.contracts]]
name = "生产代码禁止 import testenv（testenv 只服务测试）"
type = "forbidden"
source_modules = ["questor"]
forbidden_modules = ["questor.testenv"]

[[tool.importlinter.contracts]]
name = "分层：上层可依赖下层，同层独立（structure §5 矩阵的子集，随物化扩展）"
type = "layers"
layers = [
    "questor.cli",
    "questor.serve",
    "questor.habena",
    "questor.engine",
    "questor.sessiontrace",
    "questor.context",
    "questor.tools",
    "questor.review",
    "questor.limen | questor.workspaces | questor.gesta | questor.worktree",
    "questor.config | questor.secrets",
    "questor.state",
    "questor.providers",
    "questor.prompts",
    "questor.capability | questor.version | questor.schemas",
]
