name: contracts

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      # 与 justfile `arch` 同一批命令：AST allow-list 矩阵（R1 可执行形式）。
      # import-linter 声明式契约随 M2 首批真实模块引入（structure.md §5 预案）。
      - run: uv run pytest tests/architecture -q

# gen-check job 随 ui/ 退役暂停（ADR-0040/0044，Phase 0 归档）；Phase 2b 重建。
