name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 本文件的每一个 `run:` 都必须与 justfile 配方**逐字一致**，由
# tests/architecture/test_ci_parity.py 机器校验；CI 不得自带 justfile 里没有的 flag
# （曾加过不存在的 --full-path，双 OS 全红，B-69）。因此宁可不用 ruff 的 GitHub
# annotations，也不留"只在 CI 存在"的参数。
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # check_notes 靠 git 历史比较锚点的提交日期。默认浅克隆（depth=1）下
      # `git log -1 -- <路径>` 只能看到 tip，会把每个锚点都当成"今天改过"从而全体误报
      # 过期（已实际发生，B-80）；check_notes 自身也会拒跑浅仓库。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      # node 依赖必须早于钩子：gen-check 是 language: system 的本地钩子，
      # 依赖 ui/node_modules；装晚了 pre-commit 阶段必炸（B-70）。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: uv run ruff check src tests evals scripts
      - run: uv run ruff format --check --diff src tests evals scripts
      - run: uv run lint-imports
      - run: uv run pyright
      - run: uv run python scripts/ci/check_specs.py
      - run: uv run python scripts/ci/check_notes.py
      - run: node scripts/gen/types.mjs --check
      - run: npm --prefix ui run typecheck
      - run: uv build
      # 锁定钩子与 CI 同源：ruff rev 与 uv.lock 不一致、或钩子规则与门禁不一致，在这里响。
      - run: uv run pre-commit run --all-files --color=never
      - name: Show failure context
        if: failure()
        run: |
          {
            echo "## 失败上下文"
            echo
            echo '### git status'
            echo '```'
            git status --short
            echo '```'
            echo '### 工作区差异（前 200 行）'
            echo '```'
            git --no-pager diff --stat
            git --no-pager diff | head -n 200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: uv run pytest -q -rfE --color=no
      # 生成物必须在两种 OS 上都可复现：banner 的路径分隔符差异（B-68）
      # 只有在 windows runner 上也跑 gen:check 才拦得住。
      - run: node scripts/gen/types.mjs --check
      - name: Show generated diff on drift
        if: failure()
        run: |
          {
            echo "## 重生成后的差异（应为空；不为空即漂移或生成器不可复现）"
            echo
            echo '```'
            git --no-pager diff --stat
            git --no-pager diff -- ui/src/rpc/generated | head -n 120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
