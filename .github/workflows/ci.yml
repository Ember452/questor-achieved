name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 本文件的每一个 `run:` 都必须与 justfile 配方**逐字一致**，由
# tests/architecture/test_ci_parity.py 机器校验；CI 不得自带 justfile 里没有的 flag
# （曾加过不存在的 --full-path，双 OS 全红，B-69）。因此宁可不用 ruff 的 GitHub
# annotations，也不留"只在 CI 存在"的参数。
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # check_notes 靠 git 历史比较锚点的提交日期。默认浅克隆（depth=1）下
      # `git log -1 -- <路径>` 只能看到 tip，会把每个锚点都当成"今天改过"从而全体误报
      # 过期（已实际发生，B-80）；check_notes 自身也会拒跑浅仓库。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      # node/gen 链已随 ui/、desktop/ 退役暂停（ADR-0040/0044，Phase 0 归档）；
      # Phase 2b 重建新渲染层时恢复 setup-node + gen-check + typecheck（与 justfile 同批）。
      - run: uv run ruff check src tests evals scripts
      - run: uv run ruff format --check --diff src tests evals scripts
      - run: uv run lint-imports
      - run: uv run pyright
      - run: uv run python scripts/ci/check_specs.py
      - run: uv run python scripts/ci/check_notes.py
      - run: uv build
      # 锁定钩子与 CI 同源：ruff rev 与 uv.lock 不一致、或钩子规则与门禁不一致，在这里响。
      - run: uv run pre-commit run --all-files --color=never
      - name: Show failure context
        if: failure()
        run: |
          {
            echo "## 失败上下文"
            echo
            echo '### git status'
            echo '```'
            git status --short
            echo '```'
            echo '### 工作区差异（前 200 行）'
            echo '```'
            git --no-pager diff --stat
            git --no-pager diff | head -n 200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q -rfE --color=no
      # gen 跨 OS 可复现 leg（B-68）随 ui/ 退役暂停；Phase 2b 重建时恢复。
      - name: Show failure context
        if: failure()
        run: |
          {
            echo "## 测试失败上下文"
            echo
            echo '```'
            git status --short
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
