name: docs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check_notes 用 `git log -1 -- <路径>` 判锚点新鲜度：浅克隆只能看到 tip，
          # 会把所有锚点算成"今天改过"而全体误报（B-80，CI 已实际发生）。
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      # 与 justfile `specs` 同一批命令（AGENTS §四：本地与 CI 不一致视为缺陷）
      - run: uv run python scripts/ci/check_specs.py
      - run: uv run python scripts/ci/check_notes.py
      - run: uv run python scripts/ci/check_docs.py
