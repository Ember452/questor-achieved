version: 2
# 定位：pre-alpha 单人项目，依赖升级不是日常动作。保留 Dependabot 只为两件事——
# 供应链 CVE 提醒与过期工具链提示；不制造 PR 噪音。因此：月度、挡大版本、分组、限流。
# 安全更新（Security → dependabot）与 `security.yml` 的 pip-audit / npm audit 才是本仓库的主防线。
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # 跨大版本要人工评估（可能改变 lint 规则集、解析行为或 requires-python 兼容）
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # npm /ui ecosystem 随 ui/ 废弃移除（ADR-0040/0044，Phase 0 归档）；
  # Phase 2b 新渲染层住 desktop/src/renderer 时按新目录恢复，届时保留
  # "跨大版本不自动提 PR、连生成物一起复验（B-68）"的既有约束。

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns:
          - "*"
    # 动作大版本会改变 runner/Node 行为，但数量少且涉及供应链安全，
    # 不屏蔽 major，只归成一个 PR 排队人工看。
